# The public data API (DR-010 §3). Reads from D1; the Projector in
# InternalApi pushes changes to /internal/ingest.
name = "coasterpedia-api"
main = "src/index.ts"
compatibility_date = "2026-08-20"
# The wiki's /api/* is the Attractions Browser's same-origin door (DR-010
# §7.4): sessions only in practice, as nothing there holds a key.
routes = [
  { pattern = "api.coasterpedia.net", custom_domain = true },
  { pattern = "coasterpedia.net/api/*", zone_name = "coasterpedia.net" },
]
# *.workers.dev skips the zone's firewall and routes; nothing should reach the Worker that way.
workers_dev = false

# Daily, after the Projector's 03:17 sweep: prunes /v1/changes to its window.
[triggers]
crons = ["31 4 * * *"]

[vars]
# Cloudflare Access, which guards /internal/*: the team domain
# (<team>.cloudflareaccess.com) and the application's AUD tag. Ingest refuses
# everything until both are set.
ACCESS_TEAM_DOMAIN = "coasterpedia.cloudflareaccess.com"
ACCESS_AUD = "fe2c49ef588621d0f07907deb1f0a9f06c804ab77110e81aceb667738ccf434f"

# How long each Cloudflare location keeps a 200 (DR-010 §7.3). The edge can't
# purge every location when ingest lands, so this is how much older than D1 an
# answer may be: latest reads up to this much further behind the wiki. "0"
# turns the cache off.
CACHE_SECONDS = "30"

# The host the Attractions Browser's Turnstile widget must have run on
# (DR-010 §7.4). TURNSTILE_SECRET and SESSION_SECRET are Worker secrets;
# POST /v1/session is a 503 until all three are set.
TURNSTILE_HOSTNAME = "coasterpedia.net"

# Disposable: rebuildable from the wiki at any time by a sweep.
[[d1_databases]]
binding = "DATA"
database_name = "coasterpedia-api-data"
database_id = "0a6e1659-76d9-40d3-897a-ded19e013230" # from `wrangler d1 create coasterpedia-api-data`
migrations_dir = "migrations"

# key:<sha256 of the key> → { account, tier, status, name }. Written by
# scripts/create-key.mjs until the portal exists (DR-010 §10 phase 2).
[[kv_namespaces]]
binding = "KEYS"
id = "c51bbf45a14f4fbbb57dd3a5cc08011d" # from `wrangler kv namespace create KEYS`

# One data point per request (DR-010 §7.3).
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "coasterpedia_api_usage"

# Per-location burst control, keyed by account (DR-010 §7.3). One limit for
# everyone until tiers exist (DR-010 §9). BURST in src/ratelimit.ts states it
# in the RateLimit-Policy header: change both together.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Workers Logs: keeps console output, exceptions and cron runs for 7 days.
[observability]
enabled = true
head_sampling_rate = 1