name: Edge API

# The Cloudflare Worker in EdgeApi/ (DR-010). Runs when the Worker changes, or
# when the Projector rewrites the shared ingest fixture, which lives under
# EdgeApi/ and so triggers this too.
on:
  push:
    branches: [ "main" ]
    paths: [ "EdgeApi/**", ".github/workflows/edge.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "EdgeApi/**", ".github/workflows/edge.yml" ]
  workflow_dispatch:

# Never two deploys at once: migrations and code must land in order.
concurrency:
  group: edge-api-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: EdgeApi

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EdgeApi/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EdgeApi/package-lock.json

      - run: npm ci

      # Schema first, so the new code never meets the old schema. A migration
      # must therefore suit the code already running too: additive only, and
      # a removal goes in a later deploy than the code that stops using it.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DATA --remote

      - name: Deploy Worker
        run: npx wrangler deploy
